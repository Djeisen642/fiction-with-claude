<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    Social preview for "Fiction with Claude" — 1280x640.
    Vibe: trippy / dreamlike. Diagonal midnight-indigo -> violet -> magenta glow,
    soft ink-in-water nebula blobs, a faint scatter of stars, with an elegant
    Fraunces serif title and a light-italic tagline.
    Rasterize with:  node assets/render.mjs
  -->
  <defs>
    <!-- Base diagonal gradient: midnight indigo (TL) -> violet -> magenta (BR) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0c0a24"/>
      <stop offset="0.42" stop-color="#241653"/>
      <stop offset="0.72" stop-color="#532389"/>
      <stop offset="1"    stop-color="#9b2c7d"/>
    </linearGradient>

    <!-- Ink-in-water blobs: colour at the core fading to fully transparent -->
    <radialGradient id="blobViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b3ad6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7b3ad6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobMagenta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d44aa0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d44aa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fb6c9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2fb6c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2536a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2536a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b46ad0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b46ad0" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft dark halo behind the text to keep it legible over the colour -->
    <radialGradient id="textHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#080615" stop-opacity="0.62"/>
      <stop offset="0.6"  stop-color="#080615" stop-opacity="0.42"/>
      <stop offset="1"    stop-color="#080615" stop-opacity="0"/>
    </radialGradient>

    <!-- Diffusion blur for the nebula blobs (ink-in-water softness) -->
    <filter id="diffuse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- Warm outer glow for the title -->
    <filter id="titleGlow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- Tiny glow for sparkles -->
    <filter id="sparkGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- A four-point sparkle, centred on (0,0), nominal radius 10 -->
    <path id="spark" d="M0,-10 C0,-2.2 2.2,0 10,0 C2.2,0 0,2.2 0,10 C0,2.2 -2.2,0 -10,0 C-2.2,0 0,-2.2 0,-10 Z" fill="#fdf6ea"/>
  </defs>

  <!-- 1. Base gradient -->
  <rect width="1280" height="640" fill="#0c0a24"/>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- 2. Nebula blobs (blurred for ink-in-water diffusion) -->
  <g filter="url(#diffuse)">
    <ellipse cx="250"  cy="170" rx="360" ry="320" fill="url(#blobViolet)"/>
    <ellipse cx="1080" cy="540" rx="430" ry="380" fill="url(#blobMagenta)"/>
    <ellipse cx="1010" cy="110" rx="280" ry="250" fill="url(#blobCyan)"/>
    <ellipse cx="150"  cy="560" rx="340" ry="300" fill="url(#blobBlue)"/>
    <ellipse cx="700"  cy="250" rx="420" ry="300" fill="url(#blobRose)"/>
    <ellipse cx="560"  cy="610" rx="300" ry="220" fill="url(#blobViolet)"/>
  </g>

  <!-- 3. Faint star scatter (kept clear of the title band) -->
  <g fill="#ffffff">
    <circle cx="120"  cy="90"  r="1.6" opacity="0.55"/>
    <circle cx="210"  cy="150" r="1.0" opacity="0.35"/>
    <circle cx="95"   cy="240" r="1.3" opacity="0.45"/>
    <circle cx="300"  cy="80"  r="0.9" opacity="0.30"/>
    <circle cx="420"  cy="120" r="1.5" opacity="0.50"/>
    <circle cx="540"  cy="70"  r="1.0" opacity="0.35"/>
    <circle cx="700"  cy="95"  r="1.2" opacity="0.40"/>
    <circle cx="860"  cy="70"  r="0.9" opacity="0.30"/>
    <circle cx="980"  cy="130" r="1.6" opacity="0.55"/>
    <circle cx="1120" cy="95"  r="1.1" opacity="0.40"/>
    <circle cx="1180" cy="180" r="1.4" opacity="0.45"/>
    <circle cx="1210" cy="300" r="1.0" opacity="0.35"/>
    <circle cx="1150" cy="430" r="1.3" opacity="0.40"/>
    <circle cx="1080" cy="520" r="0.9" opacity="0.30"/>
    <circle cx="60"   cy="380" r="1.2" opacity="0.40"/>
    <circle cx="140"  cy="470" r="1.5" opacity="0.45"/>
    <circle cx="90"   cy="560" r="1.0" opacity="0.30"/>
    <circle cx="260"  cy="540" r="1.3" opacity="0.40"/>
    <circle cx="400"  cy="580" r="0.9" opacity="0.30"/>
    <circle cx="620"  cy="585" r="1.2" opacity="0.38"/>
    <circle cx="820"  cy="575" r="1.4" opacity="0.42"/>
    <circle cx="960"  cy="560" r="1.0" opacity="0.32"/>
    <circle cx="1170" cy="540" r="1.2" opacity="0.38"/>
    <circle cx="350"  cy="200" r="0.8" opacity="0.28"/>
    <circle cx="930"  cy="220" r="0.9" opacity="0.30"/>
  </g>

  <!-- A few brighter sparkles with a soft glow -->
  <g filter="url(#sparkGlow)">
    <use href="#spark" transform="translate(168,128) scale(0.95)" opacity="0.9"/>
    <use href="#spark" transform="translate(1112,170) scale(0.7)" opacity="0.8"/>
    <use href="#spark" transform="translate(1040,470) scale(0.6)" opacity="0.7"/>
    <use href="#spark" transform="translate(232,498) scale(0.8)" opacity="0.8"/>
    <use href="#spark" transform="translate(905,118) scale(0.5)" opacity="0.65"/>
  </g>

  <!-- 4. Dark halo to anchor the text -->
  <ellipse cx="640" cy="312" rx="560" ry="240" fill="url(#textHalo)"/>

  <!-- 5. Title: warm off-white Fraunces with a warm outer glow -->
  <g text-anchor="middle" font-family="Fraunces 144pt SemiBold">
    <text x="640" y="318" font-size="108" fill="#f6ddc0" opacity="0.55" filter="url(#titleGlow)">Fiction with Claude</text>
    <text x="640" y="318" font-size="108" fill="#f6efe2">Fiction with Claude</text>
  </g>

  <!-- 6. Tagline: light italic Fraunces -->
  <text x="640" y="408" text-anchor="middle"
        font-family="Fraunces 72pt" font-weight="300" font-style="italic"
        font-size="44" fill="#d3cae0" letter-spacing="0.6">Your imagination, drafted.</text>
</svg>
